<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a2e;
            font-family: Georgia, serif;
            color: #e0e0e0;
            padding: 24px 16px;
        }

        h2 {
            font-size: 1em;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #4a90d9;
        }

        p.section-label {
            font-size: 0.75em;
            color: #7a8aa0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 16px;
            margin-bottom: 6px;
            padding-left: 12px;
        }

        ul {
            list-style: none;
        }

        li {
            margin-bottom: 6px;
        }

        a {
            text-decoration: none;
            color: #a8c8f0;
            font-size: 0.9em;
            display: block;
            padding: 7px 12px;
            border-radius: 4px;
            border-left: 3px solid transparent;
        }

        a:hover {
            background-color: #2a2a4a;
            border-left: 3px solid #4a90d9;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <h2>Documentations</h2>

    <p class="section-label">Front-end</p>
    <ul>
        <li><a href="https://developer.mozilla.org/en-US/docs/Web/HTML" target="_blank">HTML</a></li>
        <li><a href="https://developer.mozilla.org/en-US/docs/Web/CSS" target="_blank">CSS</a></li>
        <li><a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript" target="_blank">JavaScript</a></li>
    </ul>

    <p class="section-label">Back-end</p>
    <ul>
        <li><a href="https://docs.python.org/3/" target="_blank">Python</a></li>
        <li><a href="https://nodejs.org/en/docs/" target="_blank">Node.js</a></li>
        <li><a href="https://www.w3schools.com/java/java_ref_reference.asp" target="_blank">Java</a></li>
    </ul>

</body>
</html>
